<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12332c">
<title>Kırıntı</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <main>
    <!-- KEŞFET -->
    <section id="tab-kesfet" class="tab active">
      <div class="top">
        <div class="loc">📍 <span id="locName">Kadıköy, İstanbul</span></div>
        <div class="seg" id="viewSeg"><button data-v="map" class="on">Harita</button><button data-v="list">Liste</button></div>
        <div class="chips" id="chips">
          <button data-f="hepsi" class="on">Hepsi</button>
          <button data-f="restoran">🍽️ Restoran</button>
          <button data-f="kafe">☕ Kafe</button>
          <button data-f="simdi">⏰ Şimdi açık</button>
        </div>
      </div>
      <div id="map"></div>
      <div id="list" hidden></div>
    </section>

    <!-- SİPARİŞLER -->
    <section id="tab-siparis" class="tab">
      <h2 class="h">Siparişlerim</h2>
      <div class="authbar"></div>
      <div id="orders"></div>
    </section>

    <!-- İŞLETME -->
    <section id="tab-isletme" class="tab">
      <h2 class="h">İşletme paneli</h2>
      <div class="authbar"></div>
      <div id="bizRoot"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-t="kesfet" class="on"><i>🗺️</i>Keşfet</button>
    <button data-t="siparis"><i>🧾</i>Siparişlerim</button>
    <button data-t="isletme"><i>🏪</i>İşletme</button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bg"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
  <div id="toast"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
