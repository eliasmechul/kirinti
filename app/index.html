<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12332c">
<title>Kırıntı</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <main>
    <!-- KEŞFET -->
    <section id="tab-kesfet" class="tab active">
      <header class="head">
        <div class="head-row">
          <button class="locbtn" id="locBtn">📍 <b id="locName">Kadıköy, İstanbul</b></button>
          <div class="toggle" id="viewSeg"><button data-v="list" class="on">Liste</button><button data-v="map">Harita</button></div>
        </div>
        <input id="q" class="search" type="search" placeholder="Restoran, kafe veya yemek ara">
        <div class="chips" id="chips">
          <button data-f="hepsi" class="on">Hepsi</button>
          <button data-f="restoran">🍽️ Restoran</button>
          <button data-f="kafe">☕ Kafe</button>
          <button data-f="simdi">⏰ Şimdi alınabilir</button>
        </div>
      </header>
      <div id="home" class="scroll"></div>
      <div id="mapwrap" hidden><div id="map"></div></div>
    </section>

    <!-- FAVORİLER -->
    <section id="tab-favori" class="tab">
      <h2 class="h">Favoriler</h2>
      <div id="favs" class="grid"></div>
    </section>

    <!-- SİPARİŞLER -->
    <section id="tab-siparis" class="tab">
      <h2 class="h">Siparişlerim</h2>
      <div id="orders"></div>
    </section>

    <!-- HESAP -->
    <section id="tab-hesap" class="tab">
      <h2 class="h">Hesap</h2>
      <div class="authbar"></div>
      <h3 class="sub">İşletme paneli</h3>
      <div id="bizRoot"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-t="kesfet" class="on"><i>🔍</i>Keşfet</button>
    <button data-t="favori"><i>🤍</i>Favoriler</button>
    <button data-t="siparis"><i>🛍️</i>Siparişler</button>
    <button data-t="hesap"><i>👤</i>Hesap</button>
  </nav>

  <div id="page" class="page" hidden></div>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bg"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
  <div id="toast"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
