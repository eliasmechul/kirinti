<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFC93C">
<title>Kırıntı</title>
<link rel="icon" href="../assets/logo/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <main>
    <!-- KEŞFET -->
    <section id="tab-kesfet" class="tab active">
      <div class="scroll" id="home">
        <div class="loc-row">
          <button class="locbtn" id="locBtn" type="button" aria-label="Konumu değiştir">
            <span class="locdot"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></span>
            <b>Seçili konum</b><span id="locName">Kadıköy</span>
            <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <h1 class="hero-h"><span>Yakınındaki</span>Sürpriz Paketler</h1>
        </div>
        <div class="cats" id="cats" role="group" aria-label="Kategoriler">
          <button type="button" data-c="hepsi" class="on"><img src="../assets/visuals/croissant.svg" alt=""><span>Hepsi</span></button>
          <button type="button" data-c="restoran"><img src="../assets/visuals/pide.svg" alt=""><span>Yemekler</span></button>
          <button type="button" data-c="pastane"><img src="../assets/visuals/cake.svg" alt=""><span>Pastane</span></button>
          <button type="button" data-c="kafe"><img src="../assets/visuals/coffee.svg" alt=""><span>Kafe</span></button>
          <button type="button" data-c="kahvalti"><img src="../assets/visuals/breakfast.svg" alt=""><span>Kahvaltı</span></button>
          <button type="button" data-c="simdi"><img src="../assets/visuals/soup.svg" alt=""><span>Şimdi teslim</span></button>
        </div>
        <div id="sections"></div>
      </div>
    </section>

    <!-- GÖZAT (HARİTA) -->
    <section id="tab-gozat" class="tab">
      <div id="map"></div>
      <div class="map-top">
        <label class="map-search"><span class="sr">Ara</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="q" type="search" placeholder="Restoran, kafe veya yemek ara">
        </label>
        <button type="button" class="map-list" id="toList">Liste</button>
      </div>
      <div id="pick"></div>
    </section>

    <!-- FAVORİLER -->
    <section id="tab-favori" class="tab">
      <div class="scroll pad">
        <h2 class="h">Favoriler</h2>
        <div id="favs" class="grid"></div>
      </div>
    </section>

    <!-- SİPARİŞLER -->
    <section id="tab-siparis" class="tab">
      <div class="scroll pad">
        <h2 class="h">Siparişler</h2>
        <div id="orders"></div>
      </div>
    </section>

    <!-- PROFİL -->
    <section id="tab-profil" class="tab">
      <div class="scroll pad">
        <h2 class="h">Profil</h2>
        <div class="authbar"></div>
        <h3 class="sub">İşletme paneli</h3>
        <div id="bizRoot"></div>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Ana menü">
    <button data-t="kesfet" class="on" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Keşfet</button>
    <button data-t="gozat" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Gözat</button>
    <button data-t="siparis" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l1 12H5z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Siparişler</button>
    <button data-t="favori" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>Favoriler</button>
    <button data-t="profil" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg>Profil</button>
  </nav>

  <div id="page" class="page" hidden></div>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bg"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
