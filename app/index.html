<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFC93C">
<title>Kırıntı</title>
<meta name="description" content="Kırıntı: mahalledeki restoran ve kafelerin kapanış öncesi artan yemeklerini uygun fiyata kurtar.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kırıntı">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../assets/logo/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=DM+Sans:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <main>
    <!-- KEŞFET -->
    <section id="tab-kesfet" class="tab active">
      <div class="scroll" id="home">
        <div class="loc-row">
          <button class="locbtn" id="locBtn" type="button" aria-label="Konumu değiştir">
            <span class="locdot"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></span>
            <b>Seçili konum</b><span id="locName">Kadıköy</span>
            <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <h1 class="hero-h"><span>Yakınındaki</span>Sürpriz Paketler</h1>
          <label class="search"><span class="sr">Ara</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <input id="q0" type="search" placeholder="Mekân, yemek veya tür ara" readonly aria-label="Ara: Gözat sekmesini açar">
          </label>
        </div>
        <div class="cats" id="cats" role="group" aria-label="Kategoriler">
          <button type="button" data-c="hepsi" class="on"><img src="../assets/photos/croissant.jpg" alt=""><span>Hepsi</span></button>
          <button type="button" data-c="restoran"><img src="../assets/photos/pide.jpg" alt=""><span>Yemekler</span></button>
          <button type="button" data-c="pastane"><img src="../assets/photos/cake.jpg" alt=""><span>Pastane</span></button>
          <button type="button" data-c="ekmek"><img src="../assets/photos/bread.jpg" alt=""><span>Ekmek</span></button>
          <button type="button" data-c="sebze"><img src="../assets/photos/vegetables.jpg" alt=""><span>Sebze &amp; meyve</span></button>
          <button type="button" data-c="hazir"><img src="../assets/photos/ready.jpg" alt=""><span>Hazır yemek</span></button>
          <button type="button" data-c="kafe"><img src="../assets/photos/coffee.jpg" alt=""><span>Kafe</span></button>
          <button type="button" data-c="kahvalti"><img src="../assets/photos/breakfast.jpg" alt=""><span>Kahvaltı</span></button>
          <button type="button" data-c="simdi"><img src="../assets/photos/soup.jpg" alt=""><span>Şimdi teslim</span></button>
        </div>
        <div id="sections"></div>
      </div>
    </section>

    <!-- GÖZAT: arama, filtre, harita / liste -->
    <section id="tab-gozat" class="tab">
      <div id="mapWrap"><div id="map"></div><div id="pick"></div></div>
      <div id="browseList" class="scroll" hidden></div>
      <div class="b-top">
        <div class="b-row">
          <label class="map-search"><span class="sr">Ara</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <input id="q" type="search" placeholder="Mekân, yemek veya tür ara" enterkeyhint="search">
          </label>
          <button type="button" class="fbtn" id="fBtn" aria-label="Filtreler"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg><i id="fCount" hidden>0</i></button>
        </div>
        <div class="seg" id="seg" role="group" aria-label="Görünüm">
          <button type="button" data-v="map" class="on" aria-pressed="true">Harita</button>
          <button type="button" data-v="list" aria-pressed="false">Liste</button>
        </div>
      </div>
    </section>

    <!-- FAVORİLER -->
    <section id="tab-favori" class="tab">
      <div class="scroll pad">
        <h2 class="h">Favoriler</h2>
        <div id="favs" class="grid"></div>
      </div>
    </section>

    <!-- SİPARİŞLER -->
    <section id="tab-siparis" class="tab">
      <div class="scroll pad">
        <h2 class="h">Siparişler</h2>
        <div id="orders"></div>
      </div>
    </section>

    <!-- PROFİL -->
    <section id="tab-profil" class="tab">
      <div class="scroll pad">
        <h2 class="h">Profil</h2>
        <div class="authbar"></div>
        <nav class="menu" aria-label="Profil menüsü">
          <button type="button" data-go="siparis"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l1 12H5z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>Siparişlerim</span><i aria-hidden="true">›</i></button>
          <button type="button" data-go="favori"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg><span>Favorilerim</span><i aria-hidden="true">›</i></button>
          <button type="button" data-onb><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span>Nasıl çalışır?</span><i aria-hidden="true">›</i></button>
          <button type="button" data-help><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg><span>Yardım ve sık sorulanlar</span><i aria-hidden="true">›</i></button>
        </nav>
        <details class="bizbox" id="bizBox">
          <summary>İşletme paneli <small>Restoran, fırın, kafe veya manav sahibi misin?</small></summary>
          <div id="bizRoot"></div>
        </details>
        <p class="about">Kırıntı · Sürüm 1.0<br>Ödeme şu an test aşamasında; gerçek tahsilat yapılmaz.</p>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Ana menü">
    <button data-t="kesfet" class="on" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Keşfet</button>
    <button data-t="gozat" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Gözat</button>
    <button data-t="siparis" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l1 12H5z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Siparişler</button>
    <button data-t="favori" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>Favoriler</button>
    <button data-t="profil" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg>Profil</button>
  </nav>

  <div id="page" class="page" role="dialog" aria-modal="true" aria-label="Ayrıntılar" hidden></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Panel" hidden>
    <div class="sheet-bg"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
